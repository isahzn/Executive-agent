# ── Doc Processor — nginx reverse proxy (optional) ──────────────────
# The app serves both the API and the frontend on :5000. Use this config
# to put it behind nginx on port 80 (and terminate TLS with certbot).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/doc-processor
#   sudo ln -s /etc/nginx/sites-available/doc-processor /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run:  sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;   # ← change me

    client_max_body_size 100m;     # allows uploads (backend caps at 25MB/file)

    # API + static assets all live behind the Node app.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long AI extractions can take a while
    }

    # Cache hashed frontend assets aggressively; never cache API responses.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
