<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Cpath d='M9 8.5A2.5 2.5 0 0 1 11.5 6h6l5 5v12.5A2.5 2.5 0 0 1 20 26h-8.5A2.5 2.5 0 0 1 9 23.5z' fill='%23fff'/%3E%3Cpath d='M17.5 6v4.5a1 1 0 0 0 1 1H23z' fill='%2399f6e4'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doc Processor — upload documents, extract structured data with AI, export to Excel." />
    <meta name="color-scheme" content="light dark" />
    <title>Doc Processor</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('docproc.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
