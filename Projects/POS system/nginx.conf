# ABC Accounting — Practice Management (demo)
# Deployment-ready NGINX server block for future VPS hosting.
# Serves the static demo app; swap `/srv/abc-accounting` for your deploy path.
#
#   Browser
#     ↓
#   NGINX  (this file: TLS, compression, cache, SPA fallback)
#     ↓
#   Static app files (index.html + js/ + css/)
#
# For now the app is pure static (no backend). When a real API is added,
# add a `location /api/ { proxy_pass http://127.0.0.1:8080; }` block below.

server {
    listen 80;
    listen [::]:80;
    server_name abc-accounting.example.com;   # TODO: replace with the real domain

    # Redirect all HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abc-accounting.example.com;   # TODO: replace with the real domain

    # --- TLS (put real certs here; e.g. Certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/abc-accounting.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc-accounting.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- App root ---
    root  /srv/abc-accounting;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache immutable versioned assets; index.html never cached.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        # SPA fallback so client-side routes (/dashboard etc.) reload cleanly.
        try_files $uri $uri/ /index.html;
    }

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # When backed by a real API later, add e.g.:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
